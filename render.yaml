services:
  - type: web
    name: npc-nav-api
    runtime: python
    plan: free
    rootDir: engine
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn npc_nav.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        sync: false   # dominio de Vercel, p. ej. https://npc-nav.vercel.app
